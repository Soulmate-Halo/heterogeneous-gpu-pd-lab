name: qwen38-flash-spark-3080

x-common: &common
  image: ${QWEN38_IMAGE:-ghcr.io/soulmate-halo/heterogeneous-gpu-pd-lab/qwen38-flash-spark-3080:latest}
  network_mode: host
  ipc: host
  init: true
  ulimits:
    memlock: -1
    nofile: 1048576
  volumes:
    - ${MODELS_DIR:-/srv/qwen38-models}:/models:ro
    - ${CACHE_DIR:-/srv/qwen38-cache}:/cache
    - ${STATE_DIR:-/srv/qwen38-state}:/state
    - ${QWEN38_BUNDLE_DIR:-.}/bundle/runtime.env:/opt/qwen38-flash-spark-3080/bundle/runtime.env:ro
  devices:
    - ${RDMA_CHAR_DEVICE:-/dev/infiniband}:/dev/infiniband
  environment:
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    STRATA_PACK_HOT: /models/strata-pack-hot
    STRATA_PACK_COLD: /models/strata-cold-pack
    STRATA_DENSE_GGUF: /models/dense.gguf
    STRATA_PLE_FP8: /models/ple-fp8.bin
    STRATA_PROFILE: /models/profile.bin
    STRATA_PLE_FP8_SCALE: ${STRATA_PLE_FP8_SCALE:-0.00019931793212890625}
    STRATA_REMOTE_HOST: ${STRATA_REMOTE_HOST:-}
    STRATA_REMOTE_PORT: ${STRATA_REMOTE_PORT:-39580}
    STRATA_REMOTE_HCA: ${STRATA_REMOTE_HCA:-}
    STRATA_REMOTE_GID: ${STRATA_REMOTE_GID:-0}
    STRATA_REMOTE_SLOTS: ${STRATA_REMOTE_SLOTS:-4}
    STRATA_REMOTE_SLOT_BYTES: ${STRATA_REMOTE_SLOT_BYTES:-4194304}
    STRATA_FOREGROUND: "1"
  restart: unless-stopped

services:
  spark:
    <<: *common
    gpus: all
    profiles: [spark]
    container_name: qwen38-spark
    environment:
      NVIDIA_VISIBLE_DEVICES: ${SPARK_GPUS:-all}
      STRATA_ROLE: spark
      STRATA_SPARK_HTTP_PORT: ${STRATA_SPARK_HTTP_PORT:-8200}
      STRATA_COLD_PORT: ${STRATA_REMOTE_PORT:-39580}
    command: ["spark"]
    healthcheck:
      test: ["CMD", "bash", "scripts/container-health.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3

  gpu3080:
    <<: *common
    gpus: all
    profiles: ["3080"]
    container_name: qwen38-rtx3080
    environment:
      NVIDIA_VISIBLE_DEVICES: ${ENGINE_GPUS:-0}
      STRATA_ROLE: 3080
      STRATA_HTTP_PORT: ${STRATA_HTTP_PORT:-8100}
      # Keep `docker compose config` usable before .env is filled in. The
      # runtime doctor still requires a real Spark RDMA address for 3080.
      STRATA_REMOTE_HOST: ${STRATA_REMOTE_HOST:-spark-rdma.example.invalid}
    command: ["3080"]
    healthcheck:
      test: ["CMD", "bash", "scripts/container-health.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3

  router:
    <<: *common
    profiles: [router]
    container_name: qwen38-router
    environment:
      NVIDIA_VISIBLE_DEVICES: "void"
      STRATA_ROLE: router
      STRATA_PREFILL_BACKEND: ${STRATA_PREFILL_BACKEND:-http://127.0.0.1:8200}
      STRATA_DECODE_BACKEND: ${STRATA_DECODE_BACKEND:-http://127.0.0.1:8100}
      STRATA_ROUTER_PORT: ${STRATA_ROUTER_PORT:-8400}
      STRATA_ROUTER_THRESHOLD: ${STRATA_ROUTER_THRESHOLD:-4096}
    command: ["router"]
    healthcheck:
      test: ["CMD", "bash", "scripts/container-health.sh"]
      interval: 10s
      timeout: 5s
      retries: 3

# Run the spark profile on Spark and the 3080 profile on the other host.
# The router is optional and only routes complete HTTP requests.
