# DS4.1 Flash V10 — allow the large engram mmap on the Prefill host
#
# Placeholder: none. Install this file as /etc/sysctl.d/90-dsv41-overcommit.conf
# on every host that maps the engram shards (P and the Spark nodes), then run
#   sysctl --system
# Without it, vm.overcommit_memory=0 refuses the ~101.5 GB mmap and vLLM dies
# with "unable to mmap ... Cannot allocate memory (12)".
vm.overcommit_memory = 1
