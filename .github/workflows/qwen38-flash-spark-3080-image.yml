name: Qwen3.8 Flash-Next V2 Docker image

on:
  push:
    branches: [main]
    paths:
      - qwen38-flash-spark-3080/**
      - .github/workflows/qwen38-flash-spark-3080-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify V2 bundle
        run: python qwen38-flash-spark-3080/verify_bundle.py
      - name: Verify role entrypoints without GPU
        run: |
          bash qwen38-flash-spark-3080/scripts/container-smoke.sh
          python -m py_compile qwen38-flash-spark-3080/scripts/doctor.py
          for f in qwen38-flash-spark-3080/scripts/*.sh; do bash -n "$f"; done
          docker compose -f qwen38-flash-spark-3080/docker-compose.yml config --quiet
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/qwen38-flash-spark-3080
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=V2
            org.opencontainers.image.metrics=decode_aggregate=242.37;decode_solo_aggregate=107.60;decode_single=62.00;decode_solo_single=22.30
            org.opencontainers.image.description=CUDA 13/RDMA build kit; Spark solo Prefill and Spark plus RTX 3080 joint Decode; model assets mounted at runtime
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: qwen38-flash-spark-3080
          file: qwen38-flash-spark-3080/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
