name: DS4.1 Flash V10 Docker image

on:
  push:
    branches: [main]
    paths:
      - ds41-flash-v10/**
      - .github/workflows/ds41-flash-v10-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify frozen V10 bundle
        run: python ds41-flash-v10/verify_bundle.py
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ds41-flash-v10
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ds41-flash-v10
          file: ds41-flash-v10/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
